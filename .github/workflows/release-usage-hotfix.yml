name: Prepare usage hotfix release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-usage-hotfix.yml'

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Create v0.2.20 commit and tag
        run: node scripts/release.mjs patch --push --note "Fix usage parsing when additional rate limits are null and distinguish usage-format errors from expired sign-ins."
      - name: Start platform packaging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release-gpt-reserve.yml --ref main
