name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
      release_note:
        description: 'Short release note shown in the update prompt'
        required: true
        type: string

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Verify release tag matches source versions
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (path) => fs.readFileSync(path, 'utf8');
          const pkg = JSON.parse(read('package.json')).version;
          const tauri = JSON.parse(read('src-tauri/tauri.conf.json')).version;
          const cargo = read('src-tauri/Cargo.toml').match(/^version\s*=\s*"(\d+\.\d+\.\d+)"/m)?.[1];
          const lock = read('src-tauri/Cargo.lock').match(/\[\[package\]\]\nname = "codex-switcher"\nversion = "(\d+\.\d+\.\d+)"/)?.[1];
          if (!pkg || pkg !== tauri || pkg !== cargo || pkg !== lock || process.env.RELEASE_TAG !== 'v' + pkg) {
            console.error('::error::Release tag and application versions do not match');
            process.exit(1);
          }
          console.log('Verified release version', pkg);
          NODE

      - name: Determine release note
        id: release_note
        shell: bash
        env:
          INPUT_RELEASE_NOTE: ${{ inputs.release_note }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            note="$INPUT_RELEASE_NOTE"
          else
            note="$(git tag --list --format='%(contents)' "$RELEASE_TAG")"
          fi
          {
            echo 'note<<RELEASE_NOTE_EOF'
            echo "$note"
            echo 'RELEASE_NOTE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: ${{ steps.tag.outputs.tag }}
          releaseBody: ${{ steps.release_note.outputs.note }}
          generateReleaseNotes: true
          # Keep partial builds hidden until all OS bundles, signatures and
          # latest.json are verified, particularly when ARM64 runners stall.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          retryAttempts: 3
          args: --target ${{ matrix.target }}
