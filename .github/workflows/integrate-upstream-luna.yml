name: Integrate upstream and Luna Reserve

on:
  push:
    branches:
      - merge/upstream-0.2.15-luna-reserve

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: merge/upstream-0.2.15-luna-reserve

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge Lampese upstream conservatively
        run: |
          git remote add lampese https://github.com/Lampese/codex-switcher.git || true
          git fetch lampese main
          git merge -X ours --no-edit lampese/main

      - name: Apply GPT/Luna Reserve integration
        run: python3 .github/scripts/integrate_luna.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend
        run: pnpm build

      - name: Validate Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Format and validate whitespace
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          git diff --check

      - name: Commit validated integration
        run: |
          # Upstream changed its CI workflow too. Keep our existing CI definition so
          # the Actions token only pushes application/source changes.
          git restore --source=origin/main -- .github/workflows/build.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat: sync upstream and add GPT/Luna Reserve monitoring"
          git push origin HEAD:merge/upstream-0.2.15-luna-reserve
