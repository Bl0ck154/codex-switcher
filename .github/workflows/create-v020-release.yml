name: Pre-create v0.2.20 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-v020-release.yml'

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.2.20" >/dev/null 2>&1; then
            echo "v0.2.20 release already exists"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name='v0.2.20' \
              -f name='v0.2.20' \
              -f body='Fix usage parsing when additional rate limits are null, keep GPT/Luna Reserve support, and clearly distinguish usage-format errors from expired account sign-ins.' \
              -F draft=false \
              -F prerelease=false
          fi
